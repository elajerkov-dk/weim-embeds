<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEIM 2027 – in numbers</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  * { box-sizing: border-box; }

  .counter {
    font-family: 'Brandon Text', 'brandon-text', 'Brandon Grotesque', 'brandon-grotesque', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    justify-content: center;
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 12px;
  }

  .item {
    flex: 1 1 0;
    text-align: center;
    padding: 0 12px;
    border-left: 1px solid #E3E6EA;
  }
  .item:first-child { border-left: 0; }

  .num {
    font-size: clamp(34px, 7.5vw, 72px);
    font-weight: 900;
    line-height: 1;
    color: #0A344A;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .num .plus { color: #EB6D07; }

  .bar {
    width: 40px;
    height: 3px;
    background: #EB6D07;
    margin: clamp(10px, 1.6vw, 16px) auto;
  }

  .label {
    font-size: clamp(11px, 1.7vw, 16px);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #4A5562;
    line-height: 1.35;
  }
</style>
</head>
<body>
<div class="counter">
  <div class="item">
    <div class="num"><span data-to="4700">4,700</span><span class="plus">+</span></div>
    <div class="bar"></div>
    <div class="label">Energy leaders</div>
  </div>
  <div class="item">
    <div class="num"><span data-to="125">125</span><span class="plus">+</span></div>
    <div class="bar"></div>
    <div class="label">Countries</div>
  </div>
  <div class="item">
    <div class="num"><span data-to="22">22</span></div>
    <div class="bar"></div>
    <div class="label">Issues</div>
  </div>
</div>

<script>
(function () {
  var els = document.querySelectorAll('[data-to]');
  var duration = 1800, steps = 60, started = false;

  function fmt(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function run() {
    if (started) return; started = true;
    var i = 0;
    els.forEach(function (el) { el.textContent = '0'; });
    var timer = setInterval(function () {
      i++;
      var t = i / steps;
      var eased = 1 - Math.pow(1 - t, 3);          // ease-out
      els.forEach(function (el) {
        var to = +el.getAttribute('data-to');
        el.textContent = fmt(Math.round(to * eased));
      });
      if (i >= steps) clearInterval(timer);
    }, duration / steps);
  }

  // Start when visible; fall back to starting straight away
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      if (entries.some(function (e) { return e.isIntersecting; })) { run(); io.disconnect(); }
    }, { threshold: 0.3 });
    io.observe(document.querySelector('.counter'));
    setTimeout(run, 2500);
  } else { run(); }
})();
</script>
</body>
</html>
